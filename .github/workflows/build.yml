name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build binary (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Build PHAR / CLI binary
        run: composer run build

      - name: Verify binary runs
        run: |
          if [ -f build/infer-data-schema.phar ]; then
            php build/infer-data-schema.phar --version
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infer-data-schema-php${{ matrix.php-version }}
          path: build/
          if-no-files-found: warn
